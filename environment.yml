name: ast-rag-testgen

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Python version
  - python=3.11

  # Pip packages
  - pip

  - pip:
      # Tree-sitter AST parser
      - tree-sitter>=0.21.0
      # Tree-sitter language parsers
      - tree-sitter-languages
      - tree-sitter-java

      # LLM API clients
      - openai>=1.0.0
      - anthropic>=0.18.0
      # GLM (Zhipu AI)
      - zhipuai>=2.0.0
      # Gemini (Google)
      - google-generativeai>=0.8.0

      # Environment and configuration
      - python-dotenv>=1.0.0
      - pydantic>=2.0.0
      - pydantic-settings>=2.0.0

      # File handling and utilities
      - pathspec>=0.11.0

      # Type checking and development
      - mypy>=1.0.0
      - ruff>=0.1.0
