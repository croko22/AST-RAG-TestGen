[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov=llm
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Temporarily disabled coverage requirement due to refactoring
    # --cov-fail-under=75

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
